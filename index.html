<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Asante & Grove</title>
<link rel="stylesheet" href="css/admin.css">

<!-- PWA / Add to Home Screen -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171C">
<link rel="icon" href="icons/admin-192.png">
<link rel="apple-touch-icon" href="icons/admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Backstage">
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="login-screen">
  <form class="login-card" id="login-form">
    <div class="admin-brand">Asante &amp; Grove<small>Backstage</small></div>
    <div class="field" style="margin-top:20px;"><label for="a-email">Email</label><input id="a-email" type="email" required></div>
    <div class="field"><label for="a-pass">Password</label><input id="a-pass" type="password" required></div>
    <button class="btn" style="width:100%;" type="submit">Sign in</button>
    <p id="login-error" style="color:var(--rust); font-family:var(--font-mono); font-size:0.78rem; margin-top:12px; display:none;"></p>
  </form>
</div>

<!-- DASHBOARD (hidden until authenticated + whitelisted) -->
<div id="dashboard" style="display:none;">
  <header class="admin-header">
    <div style="display:flex; align-items:center; gap:14px;">
      <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">☰</button>
      <div class="admin-brand">Asante &amp; Grove<small>Backstage</small></div>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <span id="signed-in-as" style="font-family:var(--font-mono); font-size:0.78rem; color:var(--muted);"></span>
      <button class="btn outline small" id="enable-push-btn">Enable notifications</button>
      <button class="btn outline small" id="logout-btn">Sign out</button>
    </div>
  </header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <button class="tab-btn active" data-tab="listings">Listings</button>
      <button class="tab-btn" data-tab="agents">Agents</button>
      <button class="tab-btn" data-tab="enquiries">Enquiries</button>
      <button class="tab-btn" data-tab="bookings">Bookings &amp; BTC</button>
      <button class="tab-btn" data-tab="reviews">Reviews</button>
      <button class="tab-btn" data-tab="messages">Messages<span class="tab-badge badge count" id="messages-tab-badge" style="display:none;"></span></button>
      <button class="tab-btn" data-tab="settings">Settings</button>
      <button class="tab-btn" data-tab="staff" id="staff-tab-btn" style="display:none;">Staff</button>
    </nav>
    <main class="main" id="main">
      <!-- panels injected by admin.js -->
    </main>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/admin.js"></script>
<script>
  // Registers the shell-caching service worker (see sw.js) — this is what
  // makes Chrome/Android offer "Add to Home Screen" / "Install app", and is
  // also required before push notifications can be subscribed to.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
